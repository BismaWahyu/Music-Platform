[package]
name = "music-platform"
version = "0.1.0"
description = "A modern music platform desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"

[package.metadata]
# Additional metadata for Tauri

[package.metadata.tauri-winres]
# Windows resource settings - disable for now

[package.metadata.tauri]
# Tauri metadata

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Optimised release build for the beta installer: smaller binary + faster runtime.
# (Unwinding is kept — Tauri turns a panicking command into an error instead of aborting.)
[profile.release]
opt-level = 3       # keep max speed (matters for audio decode)
lto = true          # link-time optimisation across crates
codegen-units = 1   # better optimisation at the cost of compile time
strip = true        # drop debug symbols → much smaller binary
panic = "unwind"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }

# Async Runtime — we only use tokio::sync directly (OnceCell); the async command runtime
# comes from Tauri, and reqwest pulls the net/time features it needs. Cargo unifies these,
# so dropping "full" trims the build without losing anything at runtime.
tokio = { version = "1", features = ["sync"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Audio Playback. We decode with symphonia directly (sequential, no gapless seek)
# and feed PCM to rodio, because rodio's built-in Decoder panics on a SeekError
# during init for YouTube's fragmented MP4 audio streams.
rodio = "0.20"
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3"] }

# URL Encoding
percent-encoding = "2.3"

# Base64 (for tokens)
base64 = "0.22"

# UUID
uuid = { version = "1", features = ["v4"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Date/time
chrono = "0.4"

# Lazy static
lazy_static = "1.5"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2"

# Windows 11 rounded window corners (DWM) so the transparent mini-player has no square
# corner gaps.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
